[package]
name = "furcode_main"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "furcode"
path = "src/main.rs"


[dependencies]
thiserror = { workspace = true }
clap.workspace = true
clap_complete.workspace = true
console.workspace = true
crossterm = "0.29.0"
ratatui.workspace = true
unicode-width.workspace = true
# Terminal markdown renderer for the frame TUI (AGPL-3.0 — keep isolated to TUI path).
md-tui = { version = "0.11.0", default-features = false, features = ["tree-sitter"] }
furcode_app.workspace = true
furcode_api.workspace = true
furcode_domain.workspace = true
furcode_config.workspace = true
furcode_walker.workspace = true
furcode_display.workspace = true
furcode_tracker.workspace = true
bstr.workspace = true

furcode_spinner.workspace = true
furcode_select.workspace = true

merge.workspace = true
nucleo.workspace = true
nucleo-picker.workspace = true
libc = "0.2"
furcode_fs.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
colored.workspace = true

anyhow.workspace = true
derive_setters.workspace = true
lazy_static.workspace = true
rustyline.workspace = true
nu-ansi-term.workspace = true
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
regex.workspace = true
strum.workspace = true
strum_macros.workspace = true

convert_case.workspace = true
gix.workspace = true
update-informer = { version = "1.2.0", default-features = false, features = [
    "github",
    "ureq",
    "rustls-tls",
] }
dirs.workspace = true
open.workspace = true
humantime.workspace = true
num-format.workspace = true
url.workspace = true
furcode_embed.workspace = true
include_dir.workspace = true
indexmap.workspace = true
async-recursion.workspace = true

furcode_markdown_stream.workspace = true
strip-ansi-escapes.workspace = true
terminal_size = "0.4"
rustls.workspace = true
tempfile.workspace = true
tiny_http.workspace = true

[target.'cfg(windows)'.dependencies]
enable-ansi-support.workspace = true
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.4", features = ["image-data"] }
# Encode clipboard RGBA pixels to PNG for `@[path]` image attachments.
image = { version = "0.25", default-features = false, features = ["png"] }

# Cheap NSPasteboard type probe + raw PNG/JPEG dump (no multi‑MB RGBA round-trip).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSPasteboard",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
insta.workspace = true
pretty_assertions.workspace = true
serial_test = "4.0"
fake = { version = "5.1.0", features = ["derive"] }
furcode_domain = { path = "../furcode_domain" }
